name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs on any branch. This does NOT unblock the Changesets release PR:
  # that PR is opened with GITHUB_TOKEN, so its `pull_request` run is parked in
  # `action_required`, and a dispatched run's `test (…)` checks don't satisfy
  # the PR's required checks. Approve the parked run instead — see
  # CONTRIBUTING.md, "Releasing".
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.node }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            nodeVersion: "22.19.0"
          - node: "24"
            nodeVersion: "24"
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.nodeVersion }}
          cache: true
          run-install: false # Install once below with the lockfile frozen.

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Static checks
        run: vp check --deny-warnings # Lint warnings fail CI as well as errors.

      - name: Build library
        run: vp pack

      - name: Build showcase
        if: matrix.node == '24'
        run: vp build

      - name: Test with coverage (unit project)
        run: vp test run --coverage --project unit

      - name: Install Playwright Chromium
        if: matrix.node == '24'
        run: vp exec playwright install --with-deps chromium

      - name: Test (browser project)
        if: matrix.node == '24'
        run: vp test run --project browser

      - name: Bundle size budget
        if: matrix.node == '24'
        run: vp run size

      - name: Upload coverage to Codecov
        if: matrix.node == '24'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
