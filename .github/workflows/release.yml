# Keep publishing in this workflow file: npm trusted publishing binds the OIDC
# identity to `.github/workflows/release.yml`.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Publish only after a successful push-triggered CI run on the canonical repo.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'chensid/react-use-echarts'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm OIDC trusted publishing
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Changesets needs the `main` branch checked out, but `main` can move past
      # the commit the triggering CI run tested. Release only that tested commit:
      # when `main` has moved on, the newer push's own CI run releases it once it
      # passes, so nothing untested is versioned or published.
      - name: Require the CI-tested commit
        id: tested
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" = "$TESTED_SHA" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release: main is at $head_sha but CI tested $TESTED_SHA. The newer push's CI run will release it."
          fi

      - name: Setup Vite+
        if: steps.tested.outputs.match == 'true'
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false # Install once below with the lockfile frozen.

      - name: Install dependencies
        if: steps.tested.outputs.match == 'true'
        run: vp install --frozen-lockfile

      - name: Create release PR or publish
        if: steps.tested.outputs.match == 'true'
        uses: changesets/action@v2
        with:
          # `vp run <script>` dispatches to package.json scripts:
          # version → `changeset version` (bumps + writes CHANGELOG)
          # release → `changeset publish`; prepublishOnly packs once before npm publish
          version-script: vp run version
          publish-script: vp run release
          commit-message: "chore: release"
          pr-title: "chore: release"
          github-token: ${{ secrets.GITHUB_TOKEN }}
