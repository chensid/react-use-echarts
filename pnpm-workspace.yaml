overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true

# Auto-prune stale minimumReleaseAgeExclude entries on pnpm add/update/remove (pnpm 11.22+).
minimumReleaseAgeExcludePrune: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vitest: 5.0.1
  vite-plus: 1.0.0-rc.0
  "@vitest/browser-playwright": 5.0.1
  "@vitest/coverage-v8": 5.0.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
