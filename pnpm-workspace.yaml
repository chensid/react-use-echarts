overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# Drop minimumReleaseAgeExclude entries the lockfile no longer resolves, on
# pnpm install/add/update/remove/dedupe (pnpm 11.22+). Never prunes by age:
# matured but still-locked entries are removed by hand (see CLAUDE.md).
minimumReleaseAgeExcludePrune: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
  "@vitest/browser-playwright": 5.1.1
  "@vitest/coverage-v8": 5.1.1
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
