overrides:
  vite: "catalog:"
  vitest: "catalog:"

allowBuilds:
  esbuild: true

# Auto-prune stale minimumReleaseAgeExclude entries on pnpm add/update/remove (pnpm 11.22+).
minimumReleaseAgeExcludePrune: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
  "@vitest/browser-playwright": 4.1.10
  "@vitest/coverage-v8": 4.1.10
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
